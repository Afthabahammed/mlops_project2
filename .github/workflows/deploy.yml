
name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run drift detection
        id: drift-check
        run: |
          python drift_monitor.py

      - name: Retrain ML model
        if: steps.drift-check.outputs.drift_detected == 'true'
        run: |
          python retrain.py

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn app:app \
            --host 127.0.0.1 \
            --port 8000 > server.log 2>&1 &

      - name: Test API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "API health check successful"
              exit 0
            fi
            sleep 1
          done

          cat server.log
          exit 1

      - name: Test ML prediction
        run: |
          curl -f -X POST \
            http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '[5.1, 3.5, 1.4, 0.2]'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            afthab12/ml-lab-api:latest
            afthab12/ml-lab-api:${{ github.sha }}
