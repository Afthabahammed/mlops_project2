
name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Detect data drift
      - name: Run drift detection
        id: drift-check
        run: |
          python drift_monitor.py

      # Step 5: Retrain only if drift is detected
      - name: Retrain ML model
        if: steps.drift-check.outputs.drift_detected == 'true'
        run: |
          python retrain.py

      # Step 6: Start FastAPI
      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn app:app \
            --host 127.0.0.1 \
            --port 8000 > server.log 2>&1 &

      # Step 7: Test API health
      - name: Test API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "API health check successful"
              exit 0
            fi
            sleep 1
          done

          cat server.log
          exit 1

      # Step 8: Test ML prediction
      - name: Test ML prediction
        run: |
          curl -f -X POST \
            http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '[5.1, 3.5, 1.4, 0.2]'
